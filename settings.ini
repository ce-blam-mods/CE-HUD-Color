# CE HUD Color - settings
# color: a preset name (stock, green, cyan, blue, yellow, amber, orange, red,
#        pink, purple, white) or a literal "r,g,b" of linear floats, e.g. 0.9,0.2,0.4
# intensity: multiplier; above 1.0 brightens. The tint is a MULTIPLY over the
#            stock pale-cyan HUD, so a saturated colour lands dark until you
#            push this up. 1.5-2.5 is normal for red/orange/purple.
enabled=true
# mode: "oklch" (default) or "multiply".
#   oklch    - pick the colour perceptually: the target is built at the HUD's
#              own lightness and the multiplier needed to reach it is solved
#              for, so every hue comes out equally bright with no manual
#              compensation. Uses hue/chroma/lightness below; ignores
#              color/intensity.
#   multiply - the older behaviour: the tint multiplies the HUD's own colours.
#              Multiply can only ever REMOVE light, so saturated colours land
#              dark and you compensate with `intensity`. Uses color/intensity.
mode=oklch
color=green
intensity=1.00
# --- oklch mode only -------------------------------------------------------
# hue:       degrees, 0-360. Roughly: 0 red, 45 orange, 90 yellow-green,
#            135 green, 180 cyan, 225 blue, 270 violet, 315 magenta.
# chroma:    colour strength. 0 is greyscale, 0.10-0.20 is a natural HUD,
#            above ~0.30 starts falling outside what the display can show.
# lightness: multiplier on the HUD's OWN perceived lightness. 1.0 keeps it.
hue=0.0
chroma=0.150
lightness=1.00
# The stock HUD colour the solve works from, measured off a clean capture. It
# is very nearly white -- which is exactly why a literal hue *rotation* of it
# would do nothing, and why the target is built from hue+chroma instead.
# Only change this if your setup renders the HUD noticeably differently.
base_color=0.889,0.990,1.000
# Which HUD elements get tinted (class-name substrings, comma separated).
# Ctrl+Shift+G in game prints every HUD widget it can see, matched and not, so
# you can copy names straight out of it.
# Note on motiontracker: the radar's blips are children of the tracker, so
# tinting it recolours them too and the red-vs-yellow contact distinction goes
# with them. Drop it from the list if you want the blips back.
targets=shieldhealthbar,weaponcradle,grenadecradle,equipmenticon,motiontracker,objective,banner,countdown
# Crosshair is separate: plenty of setups want a coloured HUD and a neutral
# reticle (or the reverse).
tint_reticle=false
# Recolour the ammo counter text. If another HUD mod also paints those counters,
# whichever mod loads LAST wins -- list this one below it in mods.txt.
tint_text=true
# Keybinds: MODIFIER+MODIFIER+KEY (CONTROL/SHIFT/ALT, in any order). Leave a
# value empty to unbind it. UE4SS binds at load, so a change here needs a
# restart. Key names are UE4SS's own, plus shorthands: ESC, DELETE, INSERT,
# PGUP/PGDN, LEFT/RIGHT/UP/DOWN, digits, and - = [ ] ; ' , . / \ `
key_next=CONTROL+SHIFT+J
key_prev=CONTROL+SHIFT+U
key_brighter=CONTROL+SHIFT+O
key_dimmer=CONTROL+SHIFT+I
key_toggle=CONTROL+SHIFT+M
key_report=CONTROL+SHIFT+G
key_reload=CONTROL+SHIFT+R
# ---------------------------------------------------------------------------
# ADVANCED: per-element overrides. Any name from `targets` can take its own
# colour and/or its own intensity; anything without one follows the global
# `color`/`intensity` above (and keeps following the hotkeys). Intensity is
# separately overridable because the tint is a multiply and elements do not all
# start from the same base brightness. Uncomment to try:
# multiply mode:
#color_motiontracker=red
#intensity_motiontracker=2.00
#color_shieldhealthbar=0.900,0.200,0.400
#color_reticle=amber
# oklch mode:
#hue_motiontracker=180
#chroma_motiontracker=0.22
#lightness_shieldhealthbar=1.20
